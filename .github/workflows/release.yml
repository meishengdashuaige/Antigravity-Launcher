name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: ""
            args: ""
          - platform: "windows-latest"
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
            libnm-dev xdg-utils cmake nasm perl squashfs-tools librsvg2-bin rpm

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.target != '' && matrix.target || '') }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare updater config without signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const configPath = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            const key = process.env.TAURI_SIGNING_PRIVATE_KEY;
            if (!key || key.trim() === "") {
              console.log("No TAURI_SIGNING_PRIVATE_KEY configured; disabling updater artifacts.");
              config.bundle = config.bundle || {};
              config.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(configPath, JSON.stringify(config, null, 2), "utf8");
            } else {
              console.log("TAURI_SIGNING_PRIVATE_KEY configured; keeping updater artifacts.");
            }
          '

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${{ matrix.args }}" ]; then
            npx tauri build ${{ matrix.args }}
          else
            npx tauri build
          fi

      # 处理 macOS 架构重命名
      - name: Rename macOS assets for architecture
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [[ "${{ matrix.args }}" == *"--target aarch64-apple-darwin"* ]]; then
            ARCH="aarch64"
          elif [[ "${{ matrix.args }}" == *"--target x86_64-apple-darwin"* ]]; then
            ARCH="x64"
          else
            ARCH="unknown"
          fi
          
          echo "Detected architecture: $ARCH"
          
          for dir in src-tauri/target/*/release/bundle/macos src-tauri/target/release/bundle/macos; do
            if [ -d "$dir" ]; then
              if [ -f "$dir/Antigravity Tools.app.tar.gz" ]; then
                mv "$dir/Antigravity Tools.app.tar.gz" "$dir/Antigravity Tools_${ARCH}.app.tar.gz"
                [ -f "$dir/Antigravity Tools.app.tar.gz.sig" ] && mv "$dir/Antigravity Tools.app.tar.gz.sig" "$dir/Antigravity Tools_${ARCH}.app.tar.gz.sig"
                echo "Renamed assets in $dir for Arch: $ARCH"
              fi
            fi
          done

      # 上传 updater.json 到 Artifacts
      - name: Upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.platform }}-${{ strategy.job-index }}
          path: src-tauri/target/**/release/bundle/updater/*.json
          if-no-files-found: ignore

      # 上传安装包到 Artifacts
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.sig
            src-tauri/target/**/release/bundle/deb/*.sig
            src-tauri/target/**/release/bundle/appimage/*.sig
            src-tauri/target/**/release/bundle/msi/*.sig
            src-tauri/target/**/release/bundle/nsis/*.sig
            src-tauri/target/**/release/bundle/rpm/*.sig
          if-no-files-found: warn

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          echo "Extracting release notes for version $VERSION"
          awk -v ver="$VERSION" '
            BEGIN { capture=0 }
            $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
            capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
            capture { print }
          ' README.md | sed 's/^[[:space:]]\{8\}//' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Antigravity Tools ${{ github.ref_name }} Release" > release_notes.md
          fi

      - name: Collect release files and verify
        run: |
          mkdir -p release-files
          if [ -d all-artifacts ]; then
            find all-artifacts -type f \( \
              -name "*.dmg" -o \
              -name "*.deb" -o \
              -name "*.AppImage" -o \
              -name "*.msi" -o \
              -name "*.exe" -o \
              -name "*.rpm" -o \
              -name "*.app.tar.gz" -o \
              -name "*.sig" \
            \) -print0 | while IFS= read -r -d '' file; do
              cp "$file" release-files/
            done
          fi

          echo "Collected files for release:"
          find release-files -maxdepth 1 -type f -print

          BINARY_COUNT=$(find release-files -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.rpm" -o -name "*.app.tar.gz" \) | wc -l)
          if [ "$BINARY_COUNT" -eq 0 ]; then
            echo "::error::No installer binaries found! Please inspect the build-tauri jobs for errors."
            exit 1
          fi

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          MACOS_AARCH64_SIG=$(read_sig "*_aarch64.app.tar.gz.sig")
          MACOS_X64_SIG=$(read_sig "*_x64.app.tar.gz.sig")
          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")
          LINUX_AMD64_SIG=$(read_sig "*_amd64.AppImage.sig")
          LINUX_AARCH64_SIG=$(read_sig "*_aarch64.AppImage.sig")

          if [ -n "$MACOS_AARCH64_SIG" ] || [ -n "$MACOS_X64_SIG" ] || [ -n "$WINDOWS_NSIS_SIG" ] || [ -n "$LINUX_AMD64_SIG" ] || [ -n "$LINUX_AARCH64_SIG" ]; then
            jq -n \
              --arg version "$VER" \
              --arg notes "See release page for details" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg dl "$DOWNLOAD_BASE" \
              --arg mac_a64_sig "$MACOS_AARCH64_SIG" \
              --arg mac_x64_sig "$MACOS_X64_SIG" \
              --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
              --arg linux_amd64_sig "$LINUX_AMD64_SIG" \
              --arg linux_a64_sig "$LINUX_AARCH64_SIG" \
              --arg ver "$VER" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  "darwin-aarch64": {
                    url: "\($dl)/Antigravity.Tools_aarch64.app.tar.gz",
                    signature: $mac_a64_sig
                  },
                  "darwin-x86_64": {
                    url: "\($dl)/Antigravity.Tools_x64.app.tar.gz",
                    signature: $mac_x64_sig
                  },
                  "windows-x86_64": {
                    url: "\($dl)/Antigravity.Tools_\($ver)_x64-setup.exe",
                    signature: $win_nsis_sig
                  },
                  "linux-x86_64": {
                    url: "\($dl)/Antigravity.Tools_\($ver)_amd64.AppImage",
                    signature: $linux_amd64_sig
                  },
                  "linux-aarch64": {
                    url: "\($dl)/Antigravity.Tools_\($ver)_aarch64.AppImage",
                    signature: $linux_a64_sig
                  }
                }
              }' > release-files/updater.json
            echo "updater.json created with signatures."
          else
            echo "No updater signatures found; skipping updater.json."
          fi

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          allowUpdates: true
          name: "Antigravity Tools ${{ github.ref_name }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*"
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          makeLatest: legacy
